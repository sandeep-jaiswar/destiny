[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-ingest"
version = "0.1.0"
description = "Data ingestion service for Destiny: NSE India data lake"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Sandeep Jaiswal", email = "jaiswarsandeep119@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "financeindia>=0.2.2",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "s3fs>=2024.1.0",
    "fsspec>=2024.1.0",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
]

[project.scripts]
ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/ingest --cov-report=term-missing"
